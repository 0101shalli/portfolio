<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Content Manager · Shalli Leroi</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <script>
      // Decap reads config.yml next to this file; we only add the OAuth host at runtime
      // so the same build works on localhost, Vercel previews and the production domain.
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
    <script>
      CMS.init({ config: { backend: { base_url: window.location.origin } } });
      CMS.registerPreviewStyle('/admin/preview.css');
    </script>
  </body>
</html>
