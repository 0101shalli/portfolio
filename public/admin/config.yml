# Decap CMS configuration — https://decapcms.org/docs/configuration-options/
# Open https://<your-site>/admin to write and publish blog posts from the browser.
backend:
  name: github
  repo: 0101shalli/portfolio
  branch: main
  # GitHub login is handled by api/auth.js and api/callback.js on this site.
  # If you move to a custom domain, change base_url (and the GitHub OAuth App URLs).
  base_url: https://portfolio-indol-ten-20.vercel.app
  auth_endpoint: api/auth
  commit_messages:
    create: 'blog: create {{collection}} “{{slug}}”'
    update: 'blog: update {{collection}} “{{slug}}”'
    delete: 'blog: delete {{collection}} “{{slug}}”'
    uploadMedia: 'media: upload “{{path}}”'
    deleteMedia: 'media: delete “{{path}}”'

# Uncomment to save posts as pull requests (Drafts → In review → Ready) instead of
# committing straight to main:
# publish_mode: editorial_workflow

# `npm run cms` + `npm run dev` lets you use the editor locally without logging in.
local_backend: true

site_url: https://portfolio-indol-ten-20.vercel.app
display_url: https://portfolio-indol-ten-20.vercel.app
logo_url: /favicon.svg

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  # Both collections show up in the sidebar and under the "New" button at the top:
  # pick "Blog post" to write an article, or "Accomplished work" to add a project.
  - name: blog
    label: 📝 Blog posts
    label_singular: Blog post
    description: Articles published at /blog. Use the image button in the editor toolbar to add pictures anywhere in the post. Toggle “Draft” to hide a post from the live site.
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    preview_path: 'blog/{{slug}}'
    sortable_fields: ['pubDate', 'title']
    summary: '{{title}} — {{pubDate | date("YYYY-MM-DD")}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, hint: 'One or two sentences — shown on cards, in search results and social previews.' }
      - { label: Publish date, name: pubDate, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Updated date, name: updatedDate, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { label: Cover image, name: heroImage, widget: image, required: false, hint: 'Shown at the top of the post and on its card. Landscape images (16:9) look best.' }
      - { label: Tags, name: tags, widget: list, default: [], required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown, hint: 'Click the “+” / image button in the toolbar to upload and insert images.' }

  - name: projects
    label: 🏆 Accomplished work
    label_singular: Accomplished work
    description: Projects you have completed. They appear on /work (and on the home page if “Featured” is on), each with its own page.
    folder: src/content/projects
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    preview_path: 'work/{{slug}}'
    sortable_fields: ['date', 'title', 'order']
    summary: '{{title}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text, hint: 'One or two sentences shown on the project card.' }
      - { label: Completed on, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { label: Cover screenshot, name: image, widget: image, required: false }
      - { label: Gallery, name: gallery, widget: list, required: false, default: [], field: { label: Image, name: image, widget: image }, hint: 'Extra screenshots shown at the bottom of the project page.' }
      - { label: Tech used, name: tech, widget: list, default: [], required: false }
      - { label: Live demo URL, name: demo, widget: string, required: false }
      - { label: Source code URL, name: repo, widget: string, required: false }
      - { label: Featured on home page, name: featured, widget: boolean, default: true }
      - { label: Sort order, name: order, widget: number, value_type: int, default: 100, hint: 'Lower numbers show first.' }
      - { label: Write-up, name: body, widget: markdown, required: false, hint: 'The problem, your role, how you built it and the result. Use the image button to add pictures.' }
